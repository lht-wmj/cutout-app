<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1E3F">
<title>智能抠图 · 本地免费</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="智能抠图">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230B1E3F'/%3E%3Ccircle cx='27' cy='25' r='10' fill='%2322D3EE'/%3E%3Cpath d='M11 52c2-12 10-18 16-18s14 6 16 18z' fill='%2322D3EE'/%3E%3Cpath d='M42 14l9 9-9 9' stroke='white' stroke-width='4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#0B1E3F; --bg-2:#0F2751; --bg-3:#16325C; --bg-4:#1B3D70;
  --line:#244473; --text:#E8F0FB; --text-2:#93A9C8; --text-3:#61779B;
  --accent:#22D3EE; --accent-2:#0EA5C7; --accent-dim:rgba(34,211,238,.13);
  --danger:#F87171; --warn:#FBBF24; --ok:#34D399;
  --radius:16px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei","Segoe UI",sans-serif;
  background:var(--bg);color:var(--text);font-size:15px;line-height:1.55;
  overscroll-behavior:none;
}
button{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer}
input{font-family:inherit}
.hidden{display:none!important}
#app{max-width:640px;margin:0 auto;height:100vh;height:100dvh;position:relative;display:flex;flex-direction:column;background:var(--bg)}
.view{flex:1;display:flex;flex-direction:column;min-height:0}

/* ---------- 通用顶栏 ---------- */
.topbar{
  display:flex;align-items:center;gap:10px;padding:12px 14px;flex:none;
  background:rgba(11,30,63,.92);border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:20;
}
.topbar .title{font-size:17px;font-weight:650;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon-btn{
  width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:12px;flex:none;
}
.icon-btn:active{background:var(--bg-3)}
.icon-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.text-btn{
  min-height:44px;padding:0 16px;border-radius:12px;font-size:15px;font-weight:600;flex:none;
  display:flex;align-items:center;gap:6px;background:var(--accent-dim);color:var(--accent);
}
.text-btn:active{background:rgba(34,211,238,.25)}
.text-btn:disabled{opacity:.4;pointer-events:none}
.text-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- 首页 ---------- */
#view-home{padding:22px 18px 18px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.brand-mark{
  width:52px;height:52px;border-radius:15px;flex:none;
  background:linear-gradient(145deg,var(--accent),var(--accent-2));
  display:flex;align-items:center;justify-content:center;
}
.brand-mark svg{width:30px;height:30px;stroke:#062033;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.brand h1{font-size:23px;font-weight:700;letter-spacing:.5px}
.brand p{color:var(--text-2);font-size:13px;margin-top:2px}
.entry{
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  padding:18px 16px;margin-top:14px;border-radius:var(--radius);
  background:linear-gradient(150deg,var(--bg-3),var(--bg-2));
  border:1px solid var(--line);
}
.entry:active{transform:scale(.985);border-color:var(--accent)}
.entry-ico{
  width:48px;height:48px;border-radius:13px;flex:none;background:var(--accent-dim);
  display:flex;align-items:center;justify-content:center;color:var(--accent);
}
.entry-ico svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.entry-txt{flex:1;min-width:0}
.entry-txt b{font-size:16px;font-weight:650;display:block}
.entry-txt span{font-size:12.5px;color:var(--text-2);display:block;margin-top:3px}
.entry-arrow{flex:none;color:var(--text-3)}
.entry-arrow svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.model-card{margin-top:18px;padding:15px 16px;border-radius:var(--radius);background:var(--bg-2);border:1px solid var(--line)}
.model-card .lab{font-size:13px;color:var(--text-2);margin-bottom:10px}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;min-height:40px;border-radius:9px;font-size:14px;font-weight:600;color:var(--text-2)}
.seg button.on{background:var(--accent);color:#062033}
.model-note{font-size:12px;color:var(--text-3);margin-top:10px;line-height:1.6}
.privacy{
  margin-top:22px;display:flex;align-items:flex-start;gap:9px;color:var(--text-2);font-size:12.5px;
  background:var(--bg-2);border:1px solid var(--line);border-radius:13px;padding:13px 14px;
}
.privacy svg{width:18px;height:18px;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;margin-top:1px}

/* ---------- 编辑器画布区 ---------- */
#stage{
  flex:1;min-height:0;position:relative;overflow:hidden;touch-action:none;
  background-color:#0D2549;
  background-image:
    linear-gradient(45deg,#17335E 25%,transparent 25%),
    linear-gradient(-45deg,#17335E 25%,transparent 25%),
    linear-gradient(45deg,transparent 75%,#17335E 75%),
    linear-gradient(-45deg,transparent 75%,#17335E 75%);
  background-size:22px 22px;background-position:0 0,0 11px,11px -11px,-11px 0;
}
#canvasWrap{position:absolute;left:0;top:0;transform-origin:0 0}
#bgCanvas,#fgCanvas{position:absolute;left:0;top:0}
#compareLayer{position:absolute;left:0;top:0;display:none;max-width:none}
#compareLayer.on{display:block}
.compare-bar{
  position:absolute;left:14px;right:14px;bottom:12px;z-index:5;flex:none;
  background:rgba(11,30,63,.9);border:1px solid var(--line);border-radius:13px;
  padding:10px 14px;display:flex;align-items:center;gap:12px;
}
.compare-bar span{font-size:12.5px;color:var(--text-2);flex:none}
.compare-bar input{flex:1;accent-color:var(--accent);min-height:30px}
.empty-tip{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;color:var(--text-3);pointer-events:none;
}
.empty-tip svg{width:46px;height:46px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* ---------- 编辑器控制面板 ---------- */
.editor-panel{flex:none;background:var(--bg-2);border-top:1px solid var(--line);padding:12px 14px calc(12px + env(safe-area-inset-bottom));z-index:10}
.panel-row{display:flex;align-items:center;gap:9px}
.panel-row + .panel-row{margin-top:10px}
.tool-chip{
  flex:1;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--bg-3);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:11.5px;color:var(--text-2);
}
.tool-chip svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tool-chip.on{border-color:var(--accent);color:var(--accent);background:var(--accent-dim)}
.tool-chip.erase.on{border-color:var(--danger);color:var(--danger);background:rgba(248,113,113,.12)}
.bg-chip{
  flex:1;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--bg-3);
  font-size:11.5px;color:var(--text-2);font-weight:600;display:flex;align-items:center;justify-content:center;gap:5px;
}
.bg-chip svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bg-chip.on{border-color:var(--accent);color:var(--accent);background:var(--accent-dim)}
.bg-chip .swatch{width:16px;height:16px;border-radius:5px;border:1px solid rgba(255,255,255,.35)}
.brush-row{display:flex;align-items:center;gap:11px;margin-top:10px}
.brush-row label{font-size:12.5px;color:var(--text-2);flex:none}
.brush-row input{flex:1;accent-color:var(--accent);min-height:30px}
.brush-row .val{font-size:12.5px;color:var(--accent);width:38px;text-align:right;flex:none;font-variant-numeric:tabular-nums}

/* ---------- 批量视图 ---------- */
#view-batch{min-height:0}
.batch-list{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.batch-item{
  display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;
  background:var(--bg-2);border:1px solid var(--line);
}
.thumb{width:52px;height:52px;border-radius:11px;flex:none;object-fit:cover;background:var(--bg-3)}
.bi-main{flex:1;min-width:0}
.bi-name{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bi-status{font-size:12px;color:var(--text-2);margin-top:4px;display:flex;align-items:center;gap:6px}
.bi-status.done{color:var(--ok)} .bi-status.fail{color:var(--danger)} .bi-status.run{color:var(--accent)}
.bi-bar{height:5px;border-radius:3px;background:var(--bg-4);margin-top:7px;overflow:hidden}
.bi-bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .2s}
.bi-actions{display:flex;gap:4px;flex:none}
.bi-actions button{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--text-2)}
.bi-actions button:active{background:var(--bg-3)}
.bi-actions svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.batch-footer{
  flex:none;padding:12px 14px calc(12px + env(safe-area-inset-bottom));
  background:var(--bg-2);border-top:1px solid var(--line);
  display:flex;align-items:center;gap:12px;
}
.batch-footer .sum{flex:1;min-width:0;font-size:13px;color:var(--text-2)}
.batch-footer .sum b{color:var(--text);font-variant-numeric:tabular-nums}
.primary-btn{
  min-height:48px;padding:0 22px;border-radius:13px;background:var(--accent);color:#062033;
  font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;
}
.primary-btn:active{background:#5ce0f4}
.primary-btn:disabled{opacity:.4;pointer-events:none}
.primary-btn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- 遮罩与 Toast ---------- */
#overlay{
  position:absolute;inset:0;z-index:60;background:rgba(7,18,38,.86);
  display:none;align-items:center;justify-content:center;padding:30px;
}
#overlay.on{display:flex}
.ov-card{width:100%;max-width:340px;background:var(--bg-2);border:1px solid var(--line);border-radius:18px;padding:24px 22px;text-align:center}
.spinner{
  width:44px;height:44px;margin:0 auto 16px;border-radius:50%;
  border:3px solid var(--bg-4);border-top-color:var(--accent);animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.ov-title{font-size:16px;font-weight:650}
.ov-sub{font-size:12.5px;color:var(--text-2);margin-top:7px;line-height:1.6}
.ov-bar{height:7px;border-radius:4px;background:var(--bg-4);margin-top:16px;overflow:hidden}
.ov-bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:4px;transition:width .2s}
.ov-pct{font-size:12.5px;color:var(--accent);margin-top:9px;font-variant-numeric:tabular-nums}
.ov-retry{margin-top:18px;min-height:44px;padding:0 22px;border-radius:11px;background:var(--accent);color:#062033;font-weight:700;font-size:14px}
#toast{
  position:absolute;left:50%;bottom:90px;transform:translateX(-50%) translateY(14px);z-index:80;
  background:#081830;border:1px solid var(--line);color:var(--text);font-size:13.5px;
  padding:11px 18px;border-radius:12px;max-width:86%;opacity:0;pointer-events:none;
  transition:opacity .22s,transform .22s;text-align:center;
}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media (min-width:700px){
  body{background:#08162C}
  #app{border-left:1px solid var(--line);border-right:1px solid var(--line)}
}
</style>
</head>
<body>
<div id="app">

  <!-- ===================== 视图：首页 ===================== -->
  <section id="view-home" class="view">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24"><circle cx="10" cy="9" r="4"/><path d="M3.5 20c.8-4.5 3.4-6.5 6.5-6.5s5.7 2 6.5 6.5"/><path d="M16 4l3.5 3.5L16 11"/></svg>
      </div>
      <div>
        <h1>智能抠图</h1>
        <p>手机本地处理 · 免费无广告 · 无需注册</p>
      </div>
    </div>

    <button class="entry" id="entryCamera">
      <span class="entry-ico"><svg viewBox="0 0 24 24"><path d="M4 8h3l1.5-2.5h7L17 8h3v11H4z"/><circle cx="12" cy="13.5" r="3.6"/></svg></span>
      <span class="entry-txt"><b>拍照抠图</b><span>调用相机拍摄，立刻去除背景</span></span>
      <span class="entry-arrow"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></span>
    </button>

    <button class="entry" id="entrySingle">
      <span class="entry-ico"><svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><circle cx="8.8" cy="9.5" r="1.6"/><path d="M4.5 17.5l4.5-4.5 3.5 3.2 3-2.7 4 4"/></svg></span>
      <span class="entry-txt"><b>相册选图</b><span>单张精修，支持擦除与恢复笔刷</span></span>
      <span class="entry-arrow"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></span>
    </button>

    <button class="entry" id="entryBatch">
      <span class="entry-ico"><svg viewBox="0 0 24 24"><rect x="7" y="7" width="13" height="13" rx="2.5"/><path d="M16 7V4.5A1.5 1.5 0 0014.5 3h-10A1.5 1.5 0 003 4.5v10A1.5 1.5 0 004.5 16H7"/></svg></span>
      <span class="entry-txt"><b>批量抠图</b><span>多张自动处理，打包下载透明 PNG</span></span>
      <span class="entry-arrow"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></span>
    </button>

    <div class="model-card">
      <div class="lab">推理模型（首次使用自动下载，之后由浏览器缓存）</div>
      <div class="seg" id="modelSeg">
        <button data-model="medium">高质量</button>
        <button data-model="small" class="on">省流量</button>
      </div>
      <div class="model-note" id="modelNote">省流量模型首次约 15MB（含推理组件，仅下载一次），慢网络也能完成；高质量模型约 53MB，边缘更精细。所有下载均支持断点续传，退出重进进度不丢。</div>
    </div>

    <div class="privacy">
      <svg viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 4.6-3 8.4-7 10-4-1.6-7-5.4-7-10V6z"/><path d="M9 12l2 2 4-4"/></svg>
      <div>所有图片均在本机浏览器内完成计算，不会上传到任何服务器；首次加载模型后，再次使用无需重复下载。</div>
    </div>
  </section>

  <!-- ===================== 视图：单张编辑器 ===================== -->
  <section id="view-editor" class="view hidden">
    <header class="topbar">
      <button class="icon-btn" id="editorBack" aria-label="返回">
        <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
      <div class="title" id="editorTitle">抠图编辑</div>
      <button class="text-btn" id="btnSave">
        <svg viewBox="0 0 24 24"><path d="M12 4v11m0 0l-4-4m4 4l4-4"/><path d="M5 19h14"/></svg>保存
      </button>
    </header>

    <div id="stage">
      <div class="empty-tip" id="emptyTip">
        <svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><path d="M4.5 17.5l4.5-4.5 3.5 3.2 3-2.7 4 4"/></svg>
        <span>正在准备图片…</span>
      </div>
      <div id="canvasWrap">
        <canvas id="bgCanvas"></canvas>
        <canvas id="fgCanvas"></canvas>
        <img id="compareLayer" alt="">
      </div>
      <div class="compare-bar hidden" id="compareBar">
        <span>原图对比</span>
        <input type="range" id="compareRange" min="0" max="100" value="60">
      </div>
    </div>

    <div class="editor-panel">
      <div class="panel-row">
        <button class="tool-chip erase" id="toolErase">
          <svg viewBox="0 0 24 24"><path d="M8 20h11"/><path d="M14.5 4.5l5 5L10 19H6l-2.5-2.5z"/></svg>擦除
        </button>
        <button class="tool-chip" id="toolRestore">
          <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 109-9 9 9 0 00-6.7 3L3 8"/><path d="M3 4v4h4"/></svg>恢复
        </button>
        <button class="tool-chip" id="toolCompare">
          <svg viewBox="0 0 24 24"><path d="M8 4v16M16 4v16"/><rect x="3" y="8" width="5" height="8" rx="1.5"/><rect x="16" y="8" width="5" height="8" rx="1.5"/></svg>对比
        </button>
      </div>
      <div class="brush-row">
        <label>笔刷</label>
        <input type="range" id="brushRange" min="10" max="120" value="42">
        <span class="val" id="brushVal">42</span>
      </div>
      <div class="panel-row" style="margin-top:12px">
        <button class="bg-chip on" data-bg="none">透明</button>
        <button class="bg-chip" data-bg="white">白底</button>
        <button class="bg-chip" data-bg="black">黑底</button>
        <button class="bg-chip" id="colorChip"><span class="swatch" id="colorSwatch" style="background:#22D3EE"></span>颜色</button>
        <button class="bg-chip" id="bgImageChip"><svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><circle cx="9" cy="9.5" r="1.5"/><path d="M4.5 17.5l4.5-4.5 3.5 3.2 3-2.7 4 4"/></svg>背景图</button>
      </div>
    </div>
  </section>

  <!-- ===================== 视图：批量处理 ===================== -->
  <section id="view-batch" class="view hidden">
    <header class="topbar">
      <button class="icon-btn" id="batchBack" aria-label="返回">
        <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
      <div class="title">批量抠图</div>
      <button class="text-btn" id="btnBatchReset">重新开始</button>
    </header>
    <div class="batch-list" id="batchList"></div>
    <footer class="batch-footer">
      <div class="sum" id="batchSum">准备中…</div>
      <button class="primary-btn" id="btnZip" disabled>
        <svg viewBox="0 0 24 24"><path d="M12 4v11m0 0l-4-4m4 4l4-4"/><path d="M5 19h14"/></svg>打包下载
      </button>
    </footer>
  </section>

  <!-- ===================== 全局遮罩 / Toast ===================== -->
  <div id="overlay">
    <div class="ov-card">
      <div class="spinner" id="ovSpinner"></div>
      <div class="ov-title" id="ovTitle">处理中</div>
      <div class="ov-sub" id="ovSub">请稍候</div>
      <div class="ov-bar"><i id="ovBar"></i></div>
      <div class="ov-pct" id="ovPct">0%</div>
      <button class="ov-retry hidden" id="ovRetry">重试</button>
    </div>
  </div>
  <div id="toast"></div>

  <input type="file" id="cameraInput" accept="image/*" capture="environment" class="hidden">
  <input type="file" id="fileInput" accept="image/*" class="hidden">
  <input type="file" id="bgInput" accept="image/*" class="hidden">
  <input type="color" id="colorInput" value="#22D3EE" class="hidden">
</div>

<script src="https://fastly.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script>
'use strict';

/* ============================================================
 * 一、基础工具与状态
 * ============================================================ */
const $ = (id)=>document.getElementById(id);
const MAX_EDGE = 4096;
const WASM_NAME = 'ort-wasm-simd.wasm';
const WASM_SIZE = 10595041;

function migrateModel(v){

  return 'small';
}

  tool:'', brush:42,

function toast(msg){
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(toastTimer);

/* ============================================================
 * 二、IndexedDB：分片级缓存，刷新页面可续传
 * ============================================================ */
function idbOpen(){
  return new Promise((resolve,reject)=>{
    const r = indexedDB.open('cutout_cache', 1);
    r.onupgradeneeded = ()=>r.result.createObjectStore('chunks');
    r.onsuccess = ()=>resolve(r.result);
    r.onerror = ()=>reject(r.error);
  });
}
function idbGet(db, key){
  return new Promise(resolve=>{
    const rq = db.transaction('chunks','readonly').objectStore('chunks').get(key);
    rq.onsuccess = ()=>resolve(rq.result || null);
    rq.onerror = ()=>resolve(null);
  });
}
function idbPut(db, key, val){
  return new Promise(resolve=>{
    const tx = db.transaction('chunks','readwrite');
    tx.objectStore('chunks').put(val, key);
    tx.oncomplete = ()=>resolve();
    tx.onerror = ()=>resolve();
  });
}

/* ============================================================
 * 三、可靠下载器：256KB 分片 + 多线路 + 每片重试
 * ============================================================ */
const rawFetch = window.fetch.bind(window);
const CHUNK_SIZE = 262144;

async function reliableDownload(urls, size, cacheKey, onProgress){
  const db = await idbOpen().catch(()=>null);
  const totalChunks = Math.ceil(size/CHUNK_SIZE);
  const parts = [];
  let got = 0;
  for(let ci=0; ci<totalChunks; ci++){
    const start = ci*CHUNK_SIZE;
    const end = Math.min(size, start+CHUNK_SIZE)-1;
    const expect = end-start+1;
    const key = cacheKey+'#'+ci;
    let buf = db ? await idbGet(db, key) : null;
    if(!buf){
      let lastErr = null, ok = false;
      for(let ui=0; ui<urls.length && !ok; ui++){
        for(let attempt=0; attempt<3 && !ok; attempt++){
          try{
            const resp = await rawFetch(urls[ui], {headers:{Range:'bytes='+start+'-'+end}});
            if(resp.status === 206 || resp.ok){
              const ab = await resp.arrayBuffer();
              if(ab.byteLength === expect){ buf = ab; ok = true; }
              else lastErr = new Error('分片尺寸异常');
            }else lastErr = new Error('HTTP '+resp.status);
          }catch(e){ lastErr = e; }
        }
      }
      if(!ok) throw lastErr || new Error('资源下载失败');
      if(db) await idbPut(db, key, buf);
    }
    parts.push(buf);
    got += buf.byteLength;
    if(onProgress) onProgress(got/size);
  }
  return new Blob(parts);
}

  ]}
};
function modelTotalSize(id){ return MODELS[id].files.reduce((s,f)=>s+f.size, 0); }
/* 国内 CDN 镜像（与页面同源、支持断点），海外线路作为备用 */
const MIRROR = {
  ortJs:'https://aka.doubaocdn.com/s/pfO6haPdZW',
  wasm:'https://aka.doubaocdn.com/s/QdIK2vsdoR',
  u2netp:'https://aka.doubaocdn.com/s/XqqInECyYu'
};
function cdnUrls(pkg, file){
  if(pkg === 'onnxruntime-web@1.18.0'){
    return [
      MIRROR.wasm,
      'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.18.0/dist/'+file,
      'https://fastly.jsdelivr.net/npm/onnxruntime-web@1.18.0/dist/'+file,
      'https://unpkg.com/onnxruntime-web@1.18.0/dist/'+file
    ];
  }
  if(pkg === '@rmbg/model-u2netp'){
    return [
      MIRROR.u2netp,
      'https://cdn.jsdelivr.net/npm/'+pkg+'@0.0.1/'+file,
      'https://fastly.jsdelivr.net/npm/'+pkg+'@0.0.1/'+file,
      'https://unpkg.com/'+pkg+'@0.0.1/'+file
    ];
  }
  return [
    'https://cdn.jsdelivr.net/npm/'+pkg+'@0.0.1/'+file,
    'https://fastly.jsdelivr.net/npm/'+pkg+'@0.0.1/'+file,
    'https://unpkg.com/'+pkg+'@0.0.1/'+file
  ];
}

/* ============================================================
 * 五、推理引擎加载与 fetch 守卫
 * ============================================================ */
let ortPromise = null;
function loadOrt(){
  if(ortPromise) return ortPromise;
  ortPromise = new Promise((resolve,reject)=>{
    const urls = [
      MIRROR.ortJs,
      'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.18.0/dist/ort.min.js',
      'https://fastly.jsdelivr.net/npm/onnxruntime-web@1.18.0/dist/ort.min.js',
      'https://unpkg.com/onnxruntime-web@1.18.0/dist/ort.min.js'
    ];
    let i = 0;
    function step(){
      const s = document.createElement('script');
      s.src = urls[i];
      s.onload = ()=>window.ort ? resolve(window.ort) : next();
      s.onerror = next;
      document.head.appendChild(s);
    }
    function next(){
      i++;
      if(i<urls.length) step();
      else reject(new Error('推理引擎脚本加载失败，请检查网络'));
    }
    step();
  });
  ortPromise.catch(()=>{ ortPromise = null; });
  return ortPromise;
}

let wasmPromise = null;
function ensureWasm(onProgress){
  if(wasmPromise) return wasmPromise;
  wasmPromise = reliableDownload(
    cdnUrls('onnxruntime-web@1.18.0', WASM_NAME),
    WASM_SIZE, 'wasm/1.18/'+WASM_NAME, onProgress
  );
  return wasmPromise;
}

/* 拦截引擎自身的 wasm 请求，改走可靠下载器；其他请求透传 */
function installGuard(){
  if(window.__guarded) return;
  window.__guarded = true;
  const orig = window.fetch.bind(window);
  window.fetch = function(input, init){
    const url = typeof input === 'string' ? input : (input && input.url);
    if(url && url.indexOf(WASM_NAME) >= 0){
      return ensureWasm().then(b=>new Response(b, {headers:{'Content-Type':'application/wasm'}}));
    }
    return orig(input, init);
  };
}

/* ============================================================
 * 六、推理会话与抠图
 * ============================================================ */
const sessions = {};

async function getSession(modelId, onProgress){
  if(sessions[modelId]){ if(onProgress) onProgress(1); return sessions[modelId]; }
  const ort = await loadOrt();
  ort.env.wasm.simd = true;
  ort.env.wasm.numThreads = 1;
  ort.env.wasm.wasmPaths = 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.18.0/dist/';

  const mSize = modelTotalSize(modelId);
  const wWasm = WASM_SIZE/(WASM_SIZE+mSize);
  await ensureWasm(p=>{ if(onProgress) onProgress(wWasm*p); });

  let mGot = 0;
  const parts = [];
  for(const f of MODELS[modelId].files){
    const blob = await reliableDownload(
      cdnUrls('@rmbg/model-'+MODELS[modelId].id, f.name),
      f.size, 'model/'+modelId+'/'+f.name,
      p=>{ if(onProgress) onProgress(wWasm+(1-wWasm)*((mGot+f.size*p)/mSize)); }
    );
    mGot += f.size;
    parts.push(blob);
  }
  const modelBuf = await new Blob(parts).arrayBuffer();
  const session = await ort.InferenceSession.create(modelBuf, {
    executionProviders:['wasm'], graphOptimizationLevel:'all'
  });
  sessions[modelId] = session;
  if(onProgress) onProgress(1);
  return session;
}

async function matting(srcCanvas, modelId, onProgress){
  const ort = await loadOrt();
  const session = await getSession(modelId, onProgress);
  const res = MODELS[modelId].res;

  const tc = document.createElement('canvas');
  tc.width = res; tc.height = res;
  tc.getContext('2d').drawImage(srcCanvas, 0, 0, res, res);
  const pixels = tc.getContext('2d').getImageData(0,0,res,res).data;

  const stride = res*res;
  const fp = new Float32Array(3*stride);
  for(let i=0,j=0; i<pixels.length; i+=4, j++){
    fp[j] = (pixels[i]-128)/256;
    fp[j+stride] = (pixels[i+1]-128)/256;
    fp[j+2*stride] = (pixels[i+2]-128)/256;
  }
  const tensor = new ort.Tensor('float32', fp, [1,3,res,res]);
  const out = await session.run({[session.inputNames[0]]: tensor});
  const lastName = session.outputNames[session.outputNames.length-1];
  const mask = out[lastName].data;

  const mc = document.createElement('canvas');
  mc.width = res; mc.height = res;
  const mctx = mc.getContext('2d');
  const im = mctx.createImageData(res,res);
  for(let i=0; i<stride; i++){
    const a = Math.max(0, Math.min(255, Math.round(mask[i]*255)));
    im.data[i*4] = 255; im.data[i*4+1] = 255; im.data[i*4+2] = 255;
    im.data[i*4+3] = a;
  }
  mctx.putImageData(im, 0, 0);

  const cut = document.createElement('canvas');
  cut.width = srcCanvas.width; cut.height = srcCanvas.height;
  cut.getContext('2d').drawImage(mc, 0, 0, cut.width, cut.height);
  return cut;
}

/* ============================================================
 * 七、图片工具
 * ============================================================ */
function loadImageFile(file){
  return new Promise((resolve,reject)=>{
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = ()=>{ URL.revokeObjectURL(url); resolve(img); };
    img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error('图片无法读取，请确认是有效的图片文件')); };
    img.src = url;
  });
}
function toSourceCanvas(img){
  let w = img.naturalWidth, h = img.naturalHeight;
  const longest = Math.max(w,h);
  if(longest > MAX_EDGE){
    const r = MAX_EDGE/longest;
    w = Math.round(w*r); h = Math.round(h*r);
  }
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  c.getContext('2d').drawImage(img, 0, 0, w, h);
  return c;
}
function initMask(cutCanvas){
  const c = document.createElement('canvas');
  c.width = state.srcCanvas.width; c.height = state.srcCanvas.height;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0,0,c.width,c.height);
  ctx.globalCompositeOperation = 'destination-in';
  ctx.drawImage(cutCanvas, 0, 0);
  state.maskCanvas = c;
}
function baseName(name){
  const i = name.lastIndexOf('.');
  return i>0 ? name.slice(0,i) : name;
}
function downloadBlob(blob, name){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name; a.rel = 'noopener';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 5000);
}

/* ============================================================
 * 八、单张流程
 * ============================================================ */
function resetEditor(){
  state.file = null;
  state.srcCanvas = null; state.maskCanvas = null; state.bgImgCanvas = null;
  state.bgType = 'none'; state.tool = ''; state.compareOn = false;
  state.scale = 1; state.tx = 0; state.ty = 0;
  if(state.compareUrl){ URL.revokeObjectURL(state.compareUrl); state.compareUrl = null; }
  $('emptyTip').classList.remove('hidden');
  $('compareBar').classList.add('hidden');
  $('compareLayer').classList.remove('on');
  document.querySelectorAll('.bg-chip').forEach(b=>b.classList.toggle('on', b.dataset.bg === 'none'));
  document.querySelectorAll('.tool-chip').forEach(b=>b.classList.remove('on'));
}

async function startSingle(file){
  resetEditor();
  showView('editor');
  state.file = file; state.fileName = file.name;
  $('editorTitle').textContent = file.name;
  try{
    overlayShow('读取图片', '正在打开文件…');
    const img = await loadImageFile(file);
    state.srcCanvas = toSourceCanvas(img);
    overlayShow('准备模型', '首次需要下载，已支持断点续传，退出后进度保留');
    const cut = await matting(state.srcCanvas, state.model, p=>{
      overlayProgress(p*100, '下载推理组件与模型，进度自动保存，可随时退出重进');
    });
    initMask(cut);
    if(state.compareUrl) URL.revokeObjectURL(state.compareUrl);
    state.compareUrl = URL.createObjectURL(file);
    $('compareLayer').src = state.compareUrl;
    setupCanvasGeometry();
    $('emptyTip').classList.add('hidden');
    overlayHide();
    renderAll();
  }catch(e){
    const msg = (e && e.message) || '';
    const friendly = /fetch|HTTP|Range|下载|Network/i.test(msg)
      ? '模型下载失败，已自动重试并切换线路，进度已保存，请稍后点重试继续'
      : (msg || '请检查网络连接后重试');
    overlayError('处理失败', friendly, ()=>startSingle(file));
  }
}

/* ============================================================
 * 九、编辑器：几何、渲染、触摸、控件
 * ============================================================ */
const stage = $('stage'), wrap = $('canvasWrap');
const fgCanvas = $('fgCanvas'), bgCanvas = $('bgCanvas'), compareLayer = $('compareLayer');

function setupCanvasGeometry(){
  const w = state.srcCanvas.width, h = state.srcCanvas.height;
  const rect = stage.getBoundingClientRect();
  const pad = 18;
  const ratio = Math.min((rect.width-pad*2)/w, (rect.height-pad*2)/h);
  state.cssW = Math.round(w*ratio); state.cssH = Math.round(h*ratio);
  [fgCanvas, bgCanvas].forEach(c=>{
    c.width = w; c.height = h;
    c.style.width = state.cssW+'px';
    c.style.height = state.cssH+'px';
  });
  compareLayer.style.width = state.cssW+'px';
  compareLayer.style.height = state.cssH+'px';
  state.scale = 1;
  state.tx = (rect.width-state.cssW)/2;
  state.ty = (rect.height-state.cssH)/2;
  applyTransform();
}
function applyTransform(){
  wrap.style.transform = 'translate('+state.tx+'px,'+state.ty+'px) scale('+state.scale+')';
}
function drawCover(ctx, src, w, h){
  const srcR = src.width/src.height, targetR = w/h;
  let sw, sh, sx, sy;
  if(srcR > targetR){
    sh = src.height; sw = sh*targetR; sx = (src.width-sw)/2; sy = 0;
  }else{
    sw = src.width; sh = sw/targetR; sx = 0; sy = (src.height-sh)/2;
  }
  ctx.drawImage(src, sx, sy, sw, sh, 0, 0, w, h);
}
function renderForeground(){
  const ctx = fgCanvas.getContext('2d');
  ctx.clearRect(0,0,fgCanvas.width,fgCanvas.height);
  ctx.save();
  ctx.drawImage(state.srcCanvas, 0, 0);
  ctx.globalCompositeOperation = 'destination-in';
  ctx.drawImage(state.maskCanvas, 0, 0);
  ctx.restore();
}
function renderBackground(){
  const ctx = bgCanvas.getContext('2d');
  ctx.clearRect(0,0,bgCanvas.width,bgCanvas.height);
  if(state.bgType === 'white'){
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,bgCanvas.width,bgCanvas.height);
  }else if(state.bgType === 'black'){
    ctx.fillStyle = '#000000'; ctx.fillRect(0,0,bgCanvas.width,bgCanvas.height);
  }else if(state.bgType === 'color'){
    ctx.fillStyle = state.bgColor; ctx.fillRect(0,0,bgCanvas.width,bgCanvas.height);
  }else if(state.bgType === 'image' && state.bgImgCanvas){
    drawCover(ctx, state.bgImgCanvas, bgCanvas.width, bgCanvas.height);
  }
}
function renderAll(){ renderForeground(); renderBackground(); }

function clientToCanvas(clientX, clientY){
  const rect = stage.getBoundingClientRect();
  const xCss = (clientX-rect.left-state.tx)/state.scale;
  const yCss = (clientY-rect.top-state.ty)/state.scale;
  return { x:xCss/state.cssW*fgCanvas.width, y:yCss/state.cssH*fgCanvas.height };
}
function paintAt(p, isStart){
  const mctx = state.maskCanvas.getContext('2d');
  mctx.lineCap = 'round'; mctx.lineJoin = 'round';
  mctx.lineWidth = state.brush;
  if(state.tool === 'erase'){
    mctx.globalCompositeOperation = 'destination-out';
    mctx.strokeStyle = 'rgba(0,0,0,1)'; mctx.fillStyle = 'rgba(0,0,0,1)';
  }else{
    mctx.globalCompositeOperation = 'source-over';
    mctx.strokeStyle = '#ffffff'; mctx.fillStyle = '#ffffff';
  }
  if(isStart){
    mctx.beginPath();
    mctx.arc(p.x,p.y,state.brush/2,0,Math.PI*2);
    mctx.fill();
    mctx.beginPath();
    mctx.moveTo(p.x,p.y);
  }else{
    mctx.lineTo(p.x,p.y);
    mctx.stroke();
  }
  renderForeground();
}

let pinchStart = null;
stage.addEventListener('touchstart', e=>{
  if(!state.srcCanvas) return;
  if(e.touches.length === 2){
    state.drawing = false; state.pinch = true;
    const a = e.touches[0], b = e.touches[1];
    pinchStart = {
      dist:Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY),
      cx:(a.clientX+b.clientX)/2, cy:(a.clientY+b.clientY)/2,
      scale:state.scale, tx:state.tx, ty:state.ty
    };
  }else if(e.touches.length === 1 && !state.pinch && state.tool && !state.compareOn){
    state.drawing = true;
    paintAt(clientToCanvas(e.touches[0].clientX, e.touches[0].clientY), true);
  }
},{passive:false});

stage.addEventListener('touchmove', e=>{
  if(!state.srcCanvas) return;
  if(state.pinch && e.touches.length === 2){
    e.preventDefault();
    const a = e.touches[0], b = e.touches[1];
    const dist = Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY);
    const rect = stage.getBoundingClientRect();
    const newScale = Math.max(1, Math.min(5, pinchStart.scale*dist/pinchStart.dist));
    const ix = (pinchStart.cx-rect.left-pinchStart.tx)/pinchStart.scale;
    const iy = (pinchStart.cy-rect.top-pinchStart.ty)/pinchStart.scale;
    state.scale = newScale;
    state.tx = pinchStart.cx-rect.left-ix*newScale;
    state.ty = pinchStart.cy-rect.top-iy*newScale;
    applyTransform();
  }else if(state.drawing && e.touches.length === 1){
    e.preventDefault();
    paintAt(clientToCanvas(e.touches[0].clientX, e.touches[0].clientY), false);
  }
},{passive:false});

stage.addEventListener('touchend', e=>{
  if(e.touches.length === 0){
    state.pinch = false; state.drawing = false; pinchStart = null;
  }else if(state.pinch && e.touches.length === 1){
    state.drawing = false;
  }
},{passive:false});
window.addEventListener('resize', ()=>{ if(state.srcCanvas) setupCanvasGeometry(); });

function selectTool(tool){
  state.tool = state.tool === tool ? '' : tool;
  $('toolErase').classList.toggle('on', state.tool === 'erase');
  $('toolRestore').classList.toggle('on', state.tool === 'restore');
}
$('toolErase').addEventListener('click', ()=>selectTool('erase'));
$('toolRestore').addEventListener('click', ()=>selectTool('restore'));
$('toolCompare').addEventListener('click', ()=>{
  state.compareOn = !state.compareOn;
  state.drawing = false;
  $('toolCompare').classList.toggle('on', state.compareOn);
  $('compareBar').classList.toggle('hidden', !state.compareOn);
  compareLayer.classList.toggle('on', state.compareOn);
  if(state.compareOn){
    const v = $('compareRange').value;
    compareLayer.style.clipPath = 'inset(0 '+(100-v)+'% 0 0)';
  }
});
$('compareRange').addEventListener('input', e=>{
  compareLayer.style.clipPath = 'inset(0 '+(100-e.target.value)+'% 0 0)';
});
$('brushRange').addEventListener('input', e=>{
  state.brush = parseInt(e.target.value, 10);
  $('brushVal').textContent = state.brush;
});

function markBgChip(activeEl){
  document.querySelectorAll('.bg-chip').forEach(b=>b.classList.toggle('on', b === activeEl));
}
document.querySelectorAll('.bg-chip[data-bg]').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    state.bgType = btn.dataset.bg;
    markBgChip(btn);
    renderBackground();
  });
});
$('colorInput').addEventListener('input', e=>{
  state.bgColor = e.target.value;
  $('colorSwatch').style.background = state.bgColor;
  state.bgType = 'color';
  markBgChip($('colorChip'));
  renderBackground();
});
$('colorChip').addEventListener('click', ()=>$('colorInput').click());
$('bgInput').addEventListener('change', e=>{
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  if(!file) return;
  loadImageFile(file).then(img=>{
    const c = document.createElement('canvas');
    c.width = img.naturalWidth; c.height = img.naturalHeight;
    c.getContext('2d').drawImage(img, 0, 0);
    state.bgImgCanvas = c;
    state.bgType = 'image';
    markBgChip($('bgImageChip'));
    renderBackground();
  }).catch(err=>toast(err.message));
});
$('bgImageChip').addEventListener('click', ()=>$('bgInput').click());
$('btnSave').addEventListener('click', ()=>{
  if(!state.srcCanvas){ toast('请先选择图片'); return; }
  const out = document.createElement('canvas');
  out.width = fgCanvas.width; out.height = fgCanvas.height;
  const ctx = out.getContext('2d');
  if(state.bgType !== 'none') ctx.drawImage(bgCanvas, 0, 0);
  ctx.drawImage(fgCanvas, 0, 0);
  out.toBlob(blob=>{
    if(state.batchEditIndex != null){
      const item = state.batch[state.batchEditIndex];
      if(item){
        item.blob = blob;
        item.status = 'done'; item.pct = 100;
        setBatchUi(item, 'done', '已精修');
        updateBatchSummary();
      }
      state.batchEditIndex = null;
      showView('batch');
      toast('已更新到批量结果，可继续下一张或直接打包下载');
      return;
    }
    downloadBlob(blob, baseName(state.fileName)+'_抠图.png');
    toast('已开始下载，iPhone 若未自动保存，可长按图片选择“存储图像”');
  }, 'image/png');
});
$('editorBack').addEventListener('click', ()=>{
  if(state.batchEditIndex != null){
    state.batchEditIndex = null;
    showView('batch');
  }else{
    showView('home');
  }
});

/* ============================================================
 * 十、批量处理
 * ============================================================ */
let batchRunning = false;
function isImageFile(f){
  return (f.type && f.type.indexOf('image/') === 0) || /\.(png|jpe?g|webp|bmp|gif)$/i.test(f.name);
}
function startBatch(files){
  const list = files.filter(isImageFile);
  if(!list.length){ toast('没有可处理的图片文件'); return; }
  cleanupBatch(false);
  state.batch = list.map(file=>({
    file:file, name:file.name, status:'wait', pct:0, blob:null, error:'', thumbUrl:'', el:null
  }));
  showView('batch');
  renderBatchList();
  runBatchQueue();
}
function renderBatchList(){
  const root = $('batchList');
  root.innerHTML = '';
  state.batch.forEach((item, idx)=>{
    const el = document.createElement('div');
    el.className = 'batch-item';
    el.innerHTML =
      '<img class="thumb" alt="">' +
      '<div class="bi-main"><div class="bi-name"></div>' +
      '<div class="bi-status"><span class="stxt">等待处理</span></div>' +
      '<div class="bi-bar"><i style="width:0%"></i></div></div>' +
      '<div class="bi-actions"><button class="edit hidden" aria-label="精修"></button>' +
      '<button class="retry hidden" aria-label="重试"></button>' +
      '<button class="save hidden" aria-label="保存"></button></div>';
    el.querySelector('.bi-name').textContent = item.name;
    item.thumbUrl = URL.createObjectURL(item.file);
    el.querySelector('.thumb').src = item.thumbUrl;
    const ui = {
      status:el.querySelector('.bi-status'), stxt:el.querySelector('.stxt'),
      bar:el.querySelector('.bi-bar i'), retry:el.querySelector('.retry'),
      save:el.querySelector('.save'), edit:el.querySelector('.edit')
    };
    ui.edit.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>';
    ui.edit.addEventListener('click', ()=>editBatchItem(idx));
    ui.retry.innerHTML = '<svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 109-9 9 9 0 00-6.7 3L3 8"/><path d="M3 4v4h4"/></svg>';
    ui.save.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 4v11m0 0l-4-4m4 4l4-4"/><path d="M5 19h14"/></svg>';
    ui.retry.addEventListener('click', ()=>retryItem(idx));
    ui.save.addEventListener('click', ()=>{
      if(item.blob) downloadBlob(item.blob, baseName(item.name)+'_抠图.png');
    });
    item.el = ui;
    root.appendChild(el);
  });
  updateBatchSummary();
}
function setBatchUi(item, status, txt){
  const ui = item.el;
  ui.status.className = 'bi-status'+(status==='done'?' done':status==='fail'?' fail':status==='run'?' run':'');
  ui.stxt.textContent = txt;
  if(status === 'done'){
    ui.bar.style.width = '100%';
    ui.save.classList.remove('hidden'); ui.retry.classList.add('hidden'); ui.edit.classList.remove('hidden');
  }else if(status === 'fail'){
    ui.retry.classList.remove('hidden'); ui.save.classList.add('hidden');
  }else if(status === 'run' && item.pct){
    ui.bar.style.width = item.pct+'%';
  }
}
/**
 * 从批量结果进入单张精修。
 * 直接复用已经算好的抠图结果，不再重跑模型：既省时间，也保证同一张图
 * 精修前后边缘一致（重跑会因为缩放细节差异让边缘轻微变化）。
 */
function editBatchItem(idx){
  const item = state.batch[idx];
  if(!item || !item.cutCanvas || !item.srcCanvas){ toast('这张还没有处理结果'); return; }

  resetEditor();
  showView('editor');
  state.batchEditIndex = idx;
  state.fileName = item.name;
  state.srcCanvas = item.srcCanvas;
  $('editorTitle').textContent = item.name + '（批量精修）';

  initMask(item.cutCanvas);
  if(state.compareUrl) URL.revokeObjectURL(state.compareUrl);
  state.compareUrl = URL.createObjectURL(item.file);
  $('compareLayer').src = state.compareUrl;

  setupCanvasGeometry();
  $('emptyTip').classList.add('hidden');
  renderAll();
  toast('可直接擦除、换底、调边距，保存后自动更新到批量结果');
}

async function processBatchItem(item){
  item.status = 'run';
  setBatchUi(item, 'run', '处理中 0%');
  try{
    const img = await loadImageFile(item.file);
    const src = toSourceCanvas(img);
    const cut = await matting(src, state.model, p=>{
      item.pct = Math.round(p*100);
      setBatchUi(item, 'run', '下载模型 '+item.pct+'%');
    });
    item.srcCanvas = src; item.cutCanvas = cut;
    item.blob = await new Promise(r=>cut.toBlob(r,'image/png'));
    item.status = 'done'; item.pct = 100;
    setBatchUi(item, 'done', '已完成');
  }catch(e){
    item.status = 'fail';
    item.error = (e && e.message) || '处理失败';
    setBatchUi(item, 'fail', '失败，点击右侧重试，进度已保存');
  }
  updateBatchSummary();
}
async function runBatchQueue(){
  if(batchRunning) return;
  batchRunning = true;
  $('btnZip').disabled = true;
  for(let i=0;i<state.batch.length;i++){
    if(state.batch[i].status === 'done') continue;
    await processBatchItem(state.batch[i]);
  }
  batchRunning = false;
  $('btnZip').disabled = state.batch.filter(x=>x.status==='done').length === 0;
  updateBatchSummary();
}
function retryItem(idx){
  const item = state.batch[idx];
  if(!item || item.status !== 'fail') return;
  item.status = 'wait';
  item.el.retry.classList.add('hidden');
  processBatchItem(item).then(()=>{
    if(!state.batch.some(x=>x.status==='run'||x.status==='wait')){
      $('btnZip').disabled = state.batch.filter(x=>x.status==='done').length === 0;
    }
  });
}
function updateBatchSummary(){
  const total = state.batch.length;
  const done = state.batch.filter(x=>x.status==='done').length;
  const fail = state.batch.filter(x=>x.status==='fail').length;
  const running = state.batch.some(x=>x.status==='run'||x.status==='wait');
  $('batchSum').innerHTML = '共 <b>'+total+'</b> 张 · 完成 <b>'+done+'</b>'+
    (fail?' · 失败 <b>'+fail+'</b>':'')+(running?' · 处理中…':'');
}
function cleanupBatch(goHome){
  state.batch.forEach(item=>{ if(item.thumbUrl) URL.revokeObjectURL(item.thumbUrl); });
  state.batch = []; batchRunning = false;
  $('batchList').innerHTML = '';
  $('btnZip').disabled = true;
  if(goHome) showView('home');
}
$('btnZip').addEventListener('click', async()=>{
  if(typeof JSZip === 'undefined'){ toast('打包组件未加载，请检查网络后刷新页面'); return; }
  const items = state.batch.filter(x=>x.status==='done'&&x.blob);
  if(!items.length){ toast('暂无可下载的结果'); return; }
  const zip = new JSZip();
  const used = {};
  items.forEach(item=>{
    let name = baseName(item.name)+'_抠图.png';
    if(used[name]){
      const b = baseName(name);
      let n = 2;
      while(used[b+'_'+n+'.png']) n++;
      name = b+'_'+n+'.png';
    }
    used[name] = 1;
    zip.file(name, item.blob);
  });
  $('btnZip').disabled = true;
  toast('正在压缩打包…');
  const content = await zip.generateAsync({type:'blob'});
  $('btnZip').disabled = false;
  downloadBlob(content, '批量抠图结果.zip');
});
$('btnBatchReset').addEventListener('click', ()=>cleanupBatch(true));
$('batchBack').addEventListener('click', ()=>cleanupBatch(true));

/* ============================================================
 * 十一、首页绑定与初始化
 * ============================================================ */
document.querySelectorAll('#modelSeg button').forEach(btn=>{
  btn.classList.toggle('on', btn.dataset.model === state.model);
  btn.addEventListener('click', ()=>{
    state.model = btn.dataset.model;
    localStorage.setItem('cutout_model', state.model);
    document.querySelectorAll('#modelSeg button').forEach(b=>b.classList.toggle('on', b === btn));
  });
});
$('entryCamera').addEventListener('click', ()=>$('cameraInput').click());
$('entrySingle').addEventListener('click', ()=>{
  const inp = $('fileInput');
  inp.removeAttribute('multiple');
  inp.click();
});
$('entryBatch').addEventListener('click', ()=>{
  const inp = $('fileInput');
  inp.setAttribute('multiple', '');
  inp.click();
});
$('cameraInput').addEventListener('change', e=>{
  const f = e.target.files && e.target.files[0];
  e.target.value = '';
  if(f) startSingle(f);
});
$('fileInput').addEventListener('change', e=>{
  const files = Array.from(e.target.files || []);
  e.target.value = '';
  if(!files.length) return;
  if(files.length>1) startBatch(files);
  else startSingle(files[0]);
});

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}

(function init(){
  installGuard();
  showView('home');
})();

</script>
</body>
